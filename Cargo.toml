[package]
name = "super_join"
version = "0.0.0"
edition = "2024"
authors = ["John Johnson <johnsonjo4531@gmail.com>"]
description = "A sample project with wasm-pack"
license = "MIT OR Apache-2.0"
repository = "https://github.com/johnsonjo4531/super-join"

[package.metadata.component]
package = "super-join:graphql"

[package.metadata.component.target]
# This tells cargo-component to expose the "graphql" world (defined in wit/graphql.wit)
world = "graphql"

# [package.metadata.component.dependencies]

[dependencies]
serde = { version = "1.0.219", features = ["derive", "rc"] }
serde_json = "1.0.140"
graphql-parser = "0.4.1"
sea-query = "0.32.6"
regex = "1.11.1"
wit-bindgen-rt = { version = "0.44.0", features = ["bitflags"] }
