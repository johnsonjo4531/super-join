[package]
name = "super-join"
version = "0.0.0"
edition = "2024"
authors = ["John Johnson <johnsonjo4531@gmail.com>"]
description = "A sample project with wasm-pack"
license = "MIT OR Apache-2.0"
repository = "https://github.com/johnsonjo4531/super-join"

[lib]
crate-type = ["cdylib"]

[dependencies]
graphql-parser = "0.4.1"
sea-query = "0.32.6"
serde = "1.0.219"
serde_json = "1.0.140"
tsify = "0.5.5"
wasm-bindgen = "0.2"

wit-bindgen = { version = "0.41.0", optional = true, default-features = false }
wit-bindgen-rt = { version = "0.41.0", package = "wit-bindgen-rt", optional = true }

[features]
default = []
component = ["wit-bindgen", "wit-bindgen-rt"]

